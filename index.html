<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteakyBone Launch Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SteakyBone Launch Planner</h1>
      <p>Editable launch timeline for Amazon, packaging, content, FBA, Vine, and more.</p>
    </div>
    <div class="topbar-actions">
      <button id="addTaskBtn" class="primary">+ Add task</button>
      <button id="exportBtn">Export JSON</button>
      <label class="button-like" for="importInput">Import JSON</label>
      <input id="importInput" type="file" accept="application/json" hidden />
      <button id="resetBtn" class="danger">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls-panel">
      <div class="control-row">
        <label>
          Timeline start
          <input id="timelineStart" type="date" />
        </label>
        <label>
          Timeline end
          <input id="timelineEnd" type="date" />
        </label>
        <label>
          Filter
          <select id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </label>
        <label>
          Search
          <input id="searchInput" type="search" placeholder="Search tasks..." />
        </label>
      </div>
      <div class="summary" id="summary"></div>
    </section>

    <section class="panel gantt-panel">
      <div class="section-heading">
        <div>
          <h2>Launch timeline</h2>
          <p>Click a task bar or row to edit it.</p>
        </div>
      </div>
      <div id="ganttWrap" class="gantt-wrap"></div>
    </section>

    <section class="panel table-panel">
      <div class="section-heading">
        <div>
          <h2>Task list</h2>
          <p>Use the status dropdowns to keep the plan current.</p>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Task</th>
              <th>Category</th>
              <th>Start</th>
              <th>End</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-head">
        <h2 id="dialogTitle">Add task</h2>
        <button type="button" id="closeDialogBtn" class="icon-btn" aria-label="Close">×</button>
      </div>
      <input type="hidden" id="taskId" />
      <div class="form-grid">
        <label class="wide">
          Task name
          <input id="taskName" required maxlength="120" />
        </label>
        <label>
          Category
          <input id="taskCategory" required list="categoryList" />
          <datalist id="categoryList"></datalist>
        </label>
        <label>
          Status
          <select id="taskStatus">
            <option>Not started</option>
            <option>In progress</option>
            <option>Blocked</option>
            <option>Done</option>
          </select>
        </label>
        <label>
          Start date
          <input id="taskStart" type="date" required />
        </label>
        <label>
          End date
          <input id="taskEnd" type="date" required />
        </label>
        <label>
          Owner
          <input id="taskOwner" placeholder="Alexei, supplier, Amazon..." />
        </label>
        <label>
          Priority
          <select id="taskPriority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="wide">
          Notes
          <textarea id="taskNotes" rows="4"></textarea>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="deleteTaskBtn" class="danger hidden">Delete</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save task</button>
      </div>
    </form>
  </dialog>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <h3>No tasks match this view</h3>
      <p>Change the filter or add a new task.</p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
